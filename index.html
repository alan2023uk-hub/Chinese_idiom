const BMAP=new Map(BASE.map(r=>[r[0],r]));
function ensureRev(){let n=0;rows.forEach(r=>{if(r[4]||r[5])return;const b=BMAP.get(r[0]);if(!b)return;const t=r[1],bt=b[1];if(t===bt||t.length!==bt.length)return;let o="";for(let i=0;i<t.length;i++){if(t[i]===bt[i])o+=t[i];else if(REV[t[i]]===bt[i])o+=bt[i];else{o=null;break}}if(o&&o!==t){r[1]=o;n++}});if(n){save();msg("已還原 "+n+" 條被誤轉的字（里、后、征、台、斗、托、云、余、冲、采）。")}}

let BPOS=null;fetch("bpos.json").then(r=>r.ok?r.json():null).then(j=>{BPOS=j}).catch(()=>{});
let bpg=0,bcode=0;
function openBook(pg,code){bpg=pg;bcode=code||0;$("bv").style.display="flex";showBook()}
let bu=null,btk=0;
async function showBook(){const tk=++btk;const m=MAP.find(x=>x[0]===bpg);$("bt").textContent=bpg<108?"前置頁 "+bpg+"/10":"第 "+bpg+" 頁"+(m?" · 編碼 "+m[1]+"–"+m[2]:"");const im=$("bm");im.onload=placeHL;$("bw").scrollTop=0;
 let r=null;try{r=await idbGet(bpg)}catch(e){}
 if(tk!==btk)return;if(bu){URL.revokeObjectURL(bu);bu=null}
 if(r){bu=URL.createObjectURL(new Blob([r.b],{type:r.t}));im.src=bu}
 else{try{const x=await fetch("b/"+bpg+".jpg");if(tk!==btk)return;if(x.ok){const bl=await x.blob();if(tk!==btk)return;bu=URL.createObjectURL(bl);im.src=bu;return}}catch(e){}
  if(tk!==btk)return;im.removeAttribute("src");$("bt").textContent+=" · 找不到此頁圖片（本機未匯入，網站 b/ 也沒有）"}}
function placeHL(){const o=document.querySelector("#bi .hl");if(o)o.remove();const p=BPOS&&bcode&&BPOS[bcode];if(!p||p[0]!==bpg)return;const h=document.createElement("div");h.className="hl";h.style.left=p[1]*100+"%";h.style.top=p[2]*100+"%";h.style.width=p[3]*100+"%";h.style.height=p[4]*100+"%";$("bi").appendChild(h);$("bw").scrollTop=Math.max(0,$("bm").clientHeight*p[2]-80)}
$("pre").onclick=()=>openBook(1,0);
$("bp").onclick=()=>{if(bpg>108||(bpg>1&&bpg<=10)){bpg--;bcode=0;showBook()}};
$("bn").onclick=()=>{if((bpg<622&&bpg>=108)||bpg<10){bpg++;bcode=0;showBook()}};
$("bx").onclick=()=>{$("bv").style.display="none"};
document.addEventListener("keydown",e=>{if($("bv").style.display!=="flex")return;if(e.key==="Escape")$("bx").click();if(e.key==="ArrowLeft")$("bp").click();if(e.key==="ArrowRight")$("bn").click()});

const IDB=()=>new Promise((ok,no)=>{const r=indexedDB.open("bookpg",1);r.onupgradeneeded=()=>r.result.createObjectStore("p");r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
async function idbPut(k,v){const d=await IDB();return new Promise((ok,no)=>{const t=d.transaction("p","readwrite");t.objectStore("p").put(v,k);t.oncomplete=ok;t.onerror=()=>no(t.error)})}
async function idbGet(k){const d=await IDB();return new Promise((ok,no)=>{const q=d.transaction("p").objectStore("p").get(k);q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)})}
async function idbCount(){const d=await IDB();return new Promise(ok=>{const q=d.transaction("p").objectStore("p").count();q.onsuccess=()=>ok(q.result);q.onerror=()=>ok(0)})}
const bm=t=>{$("bmsg").textContent=t};
idbCount().then(n=>{if(n)bm("本機已有 "+n+" 頁原文圖片。")}).catch(()=>{});
$("bf").onchange=async e=>{const fs=[...e.target.files].filter(f=>/^\d+\.jpe?g$/i.test(f.name));let ok=0,bad=0;
 try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(x){}
 for(let i=0;i<fs.length;i++){bm("匯入中 "+(i+1)+"/"+fs.length+"（失敗 "+bad+"）");try{await idbPut(parseInt(fs[i].name),{t:fs[i].type||"image/jpeg",b:await fs[i].arrayBuffer()});ok++}catch(err){bad++}}
 bm("完成：匯入 "+ok+" 頁，失敗 "+bad+"。目前本機共 "+await idbCount()+" 頁。")};
